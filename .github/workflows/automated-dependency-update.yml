name: Automated Dependency Updates

on:
    schedule:
        # Run every Monday at midnight UTC
        - cron: '0 0 * * 1'
    workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
    contents: write
    pull-requests: write

jobs:
    update-dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  ref: dev

            - name: Close Old Dependency PRs (> 7 days)
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  now=$(date +%s)
                  prs=$(gh pr list --state open --json number,createdAt,author,headRefName,isCrossRepository)
                  echo "$prs" | jq -c '.[]' | while read -r pr; do
                      pr_number=$(echo "$pr" | jq -r '.number')
                      pr_created=$(echo "$pr" | jq -r '.createdAt')
                      pr_author=$(echo "$pr" | jq -r '.author.login')
                      pr_branch=$(echo "$pr" | jq -r '.headRefName')
                      pr_is_fork=$(echo "$pr" | jq -r '.isCrossRepository')

                      created_epoch=$(date -d "$pr_created" +%s)
                      age_seconds=$((now - created_epoch))
                      age_days=$((age_seconds / 86400))

                      if [ "$age_days" -ge 7 ] && { { [ "$pr_author" = "app/dependabot" ] || [ "$pr_author" = "dependabot[bot]" ]; } || [[ "$pr_branch" == deps/* ]]; }; then
                          echo "Closing PR #$pr_number ($pr_branch) created by $pr_author - $age_days days old..."
                          gh pr close "$pr_number" --comment "Closing this dependency update pull request because it has been unmerged for over a week."
                          # Only delete branches that live in this repository, never for PRs opened from forks
                          if [ "$pr_is_fork" = "false" ]; then
                              gh api -X DELETE "repos/{owner}/{repo}/git/refs/heads/$pr_branch" || true
                          fi
                      fi
                  done

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm

            - name: Generate Build Info
              run: bash create_build_info.sh
              working-directory: frontend

            - name: Install Dependencies
              run: pnpm install --no-frozen-lockfile

            # Within the ranges in each package.json. Majors stay a manual step.
            - name: Update Monorepo Dependencies
              run: pnpm update -r

            # `pnpm update -r` leaves exact pins (AWS SDK, webpack, winston, ...)
            # alone. Move them to the newest release in the same major; the
            # install afterwards updates the lockfile.
            - name: Update exact pins
              run: |
                  node .github/scripts/update-exact-pins.mjs
                  pnpm install --no-frozen-lockfile

            # Collapse duplicate copies left behind by the update (two vite
            # versions break `tsc -b` on frontend/quasar.config.ts).
            - name: Dedupe lockfile
              run: pnpm dedupe

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.10'

            - name: Run Version Bump
              run: |
                  pnpm run bump:patch

            # Generates frontend/.quasar/tsconfig.json. Without it `tsc -b` fails
            # (and emits stray .js files next to the frontend sources).
            - name: Prepare Quasar
              run: pnpm exec quasar prepare
              working-directory: frontend

            - name: Apply lint and format fixes
              run: |
                  pnpm run lint || true
                  pnpm run prettier

            # Failures here must not stop the PR: an update that needs code
            # changes should still reach a human, with the results in the body.
            - name: Type Check
              id: type_check
              continue-on-error: true
              run: pnpm run type-check

            - name: Lint Check
              id: lint_check
              continue-on-error: true
              run: pnpm run lint:check

            - name: Summarize checks
              id: summary
              run: |
                  icon() { [ "$1" = "success" ] && echo "✅ passed" || echo "❌ failed, needs fixes before merging"; }
                  {
                    echo "body<<EOF"
                    echo "Automated weekly update of the npm workspace dependencies, plus a patch version bump."
                    echo ""
                    echo "- \`pnpm update -r\` (within the ranges in each package.json; majors are not touched)"
                    echo "- exact pins moved to the newest release in the same major (\`.github/scripts/update-exact-pins.mjs\`; pre-release pins untouched)"
                    echo "- \`pnpm dedupe\`, lint and prettier autofixes"
                    echo ""
                    echo "| Check | Result |"
                    echo "|---|---|"
                    echo "| \`pnpm run type-check\` | $(icon "${{ steps.type_check.outcome }}") |"
                    echo "| \`pnpm run lint:check\` | $(icon "${{ steps.lint_check.outcome }}") |"
                    echo ""
                    echo "Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    echo ""
                    echo "**CI does not start on its own for this PR**: it was opened with \`GITHUB_TOKEN\`, and GitHub does not trigger workflows for that token's events. Close and reopen the PR to run the checks."
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Create Pull Request
              uses: peter-evans/create-pull-request@v8
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  commit-message: 'chore(release): bump version and update dependencies'
                  title: 'chore(release): automated dependency update & version bump'
                  body: ${{ steps.summary.outputs.body }}
                  branch: deps/automated-update
                  base: dev
                  delete-branch: true
                  labels: |
                      dependencies
                  assignees: |
                      wp99cp
