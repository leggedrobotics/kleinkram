name: Build and Deploy CLI Tool

on:
    push:
        branches:
            - main
            - dev
        paths:
            - 'cli/**'
            - '.github/workflows/update-pypi.yml'
            - '.github/scripts/release.py'

jobs:
    update-pypi:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.12'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install build twine

            - name: Run release script in dev mode to set __local__ False
              if: github.ref == 'refs/heads/dev'
              run: |
                  python .github/scripts/release.py --dev

            - name: Run release script to set __local__ False
              if: github.ref == 'refs/heads/main'
              run: |
                  python .github/scripts/release.py

            - name: Build package
              run: |
                  cd cli
                  python -m build

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@v1.14.3
              with:
                  user: __token__
                  password: ${{ secrets.PYPI_API_TOKEN }}
                  package: cli/dist/*
                  packages_dir: cli/dist

            # The sample action images install this exact wheel instead of
            # fetching it back from PyPI, whose index lags behind uploads.
            - name: Upload wheel for the sample action images
              uses: actions/upload-artifact@v7
              with:
                  name: kleinkram-wheel
                  path: cli/dist/*.whl
                  if-no-files-found: error

    build-sample-actions:
        needs: update-pypi
        permissions:
            contents: read
        uses: ./.github/workflows/build-sample-actions.yml
        with:
            wheel-artifact: kleinkram-wheel
        secrets: inherit
