name: Check Migrations

on:
    pull_request:
        branches:
            - main
            - dev

jobs:
    check-migrations:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22.23.5'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              working-directory: backend

            - name: Check migrations
              run: pnpm run migration:check
              working-directory: backend

    check-schema-docs:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22.23.5'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --filter kleinkram-docs

            - name: Regenerate the database schema page
              run: pnpm --filter kleinkram-docs run gen:entities

            - name: Check the database schema page is up to date
              run: |
                  if ! git diff --exit-code -- docs/development/application-structure/database-schema.md; then
                      echo "::error::database-schema.md is out of date. Run 'pnpm --filter kleinkram-docs run gen:entities' and commit the result."
                      exit 1
                  fi
