version: 2
updates:
    - package-ecosystem: 'pip'
      directory: '/cli'
      schedule:
          interval: 'weekly'
      target-branch: 'dev'
      groups:
          python-dependencies:
              patterns:
                  - '*'

    - package-ecosystem: 'npm'
      directory: '/frontend'
      schedule:
          interval: 'weekly'
      target-branch: 'dev'
      ignore:
          # TS 7.0 has no compiler API (nest-cli, ts-jest, vue-tsc need it), see #2531
          - dependency-name: 'typescript'
            versions: ['>=7.0.0']
      groups:
          frontend-dependencies:
              patterns:
                  - '*'

    - package-ecosystem: 'npm'
      directory: '/backend'
      schedule:
          interval: 'weekly'
      target-branch: 'dev'
      ignore:
          # TS 7.0 has no compiler API (nest-cli, ts-jest, vue-tsc need it), see #2531
          - dependency-name: 'typescript'
            versions: ['>=7.0.0']
      groups:
          backend-dependencies:
              patterns:
                  - '*'

    - package-ecosystem: 'npm'
      directory: '/queueConsumer'
      schedule:
          interval: 'weekly'
      target-branch: 'dev'
      ignore:
          # TS 7.0 has no compiler API (nest-cli, ts-jest, vue-tsc need it), see #2531
          - dependency-name: 'typescript'
            versions: ['>=7.0.0']
      groups:
          queue-consumer-dependencies:
              patterns:
                  - '*'

    - package-ecosystem: 'npm'
      directory: '/docs'
      schedule:
          interval: 'weekly'
      target-branch: 'dev'
      groups:
          docs-dependencies:
              patterns:
                  - '*'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      target-branch: 'dev'
      groups:
          github-actions-dependencies:
              patterns:
                  - '*'
