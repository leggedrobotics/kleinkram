version: 2
updates:
    - package-ecosystem: 'pip'
      directory: '/cli'
      schedule:
          interval: 'weekly'
      target-branch: 'dev'
      groups:
          python-dependencies:
              patterns:
                  - '*'

    # No npm entries: Dependabot changes the workspace package.json files but
    # never the shared root pnpm-lock.yaml, so every npm PR failed
    # `pnpm install --frozen-lockfile`. npm dependencies are updated by the
    # weekly .github/workflows/automated-dependency-update.yml instead.

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      target-branch: 'dev'
      groups:
          github-actions-dependencies:
              patterns:
                  - '*'
