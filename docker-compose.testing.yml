# this file is used in CI to run test cases
services:
    base:
        image: kleinkram-base
        build:
            context: .
            dockerfile: docker/base.Dockerfile

    action_test_file_hash:
        image: rslethz/kleinkram_actions:file-hash-latest
        container_name: kleinkram-action-test-file-hash-test
        build:
            context: ./
            dockerfile: backend/tests/actions/file-hash/Dockerfile
        entrypoint: sh

    api-server:
        image: rslethz/kleinkram:api-server-latest
        container_name: kleinkram-api-server-test
        build:
            context: .
            dockerfile: docker/backend.Dockerfile
            target: production
            additional_contexts:
                kleinkram-base: service:base
                action-test-file-hash: service:action_test_file_hash
        ports:
            - 127.0.0.1:${SERVER_PORT}:${SERVER_PORT}
        volumes:
            - ./backend/.endpoints:/app/backend/.endpoints
            - ./backend/access_config.dev.json:/app/config/access_config.json:ro
        environment:
            ACCESS_CONFIG_PATH: /app/config/access_config.json
            SEED: 'false'
            DEVBUILD: 'false'
            REDIS_HOST: 'redis'
            NODE_ENV: 'test'
        env_file:
            - .env
        networks:
            - webnet
            - privatenet
        depends_on:
            database:
                condition: service_started
            loki-ready:
                condition: service_completed_successfully

    loki:
        image: grafana/loki
        container_name: kleinkram-loki-test
        ports:
            - '3100:3100'
        command:
            - --config.file=/mnt/config/loki-config.yml
            - -log.level=error
        volumes:
            - ./observability/loki/loki-config.yml:/mnt/config/loki-config.yml:ro
        networks:
            - privatenet
            - webnet

    # Loki reports /ready as 503 for a while after startup (ring join, WAL
    # replay, min_ready_duration), during which action submissions are
    # rejected. The grafana/loki image ships no shell, so it cannot run a
    # healthcheck of its own -- this one-shot container does the waiting and
    # lets dependents gate on `service_completed_successfully`.
    loki-ready:
        image: curlimages/curl:latest
        container_name: kleinkram-loki-ready-test
        restart: 'no'
        depends_on:
            - loki
        entrypoint:
            - sh
            - -c
            - |
                echo "waiting for Loki to become ready..."
                for _ in $$(seq 1 120); do
                    if curl -sf http://loki:3100/ready > /dev/null; then
                        echo "Loki is ready"
                        exit 0
                    fi
                    sleep 1
                done
                echo "Loki did not become ready within 120s" >&2
                exit 1
        networks:
            - privatenet

    database:
        image: postgres:17
        container_name: kleinkram-postgres-test
        ports:
            - '5432:5432'
        networks:
            - privatenet
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
        volumes:
            - db_data_test:/var/lib/postgresql/data
            - ./docker/testing-pg_hba.conf:/etc/postgresql/pg_hba.conf

    seaweedfs:
        image: chrislusf/seaweedfs:4.17
        container_name: kleinkram-seaweedfs-test

        command: server -dir=/data -s3 -s3.port=9000

        volumes:
            - seaweedfs_data_test:/data
            - ./docker/seaweedfs-entrypoint.sh:/docker-entrypoint.sh:ro

        environment:
            S3_DATA_BUCKET_NAME: ${S3_DATA_BUCKET_NAME}
            S3_DB_BUCKET_NAME: ${S3_DB_BUCKET_NAME}
            S3_ARTIFACTS_BUCKET_NAME: ${S3_ARTIFACTS_BUCKET_NAME}
            S3_SCRIPTS_BUCKET_NAME: ${S3_SCRIPTS_BUCKET_NAME}
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}

        entrypoint: ['/docker-entrypoint.sh']

        ports:
            - '127.0.0.1:9000:9000'
            - '127.0.0.1:9333:9333'
        networks:
            - webnet
            - privatenet

    frontend:
        image: rslethz/kleinkram:frontend-dev
        container_name: kleinkram-frontend-test

        build:
            context: .
            dockerfile: docker/frontend.Dockerfile
            args:
                - BACKEND_URL=${BACKEND_URL}
                - GIT_BRANCH=${GIT_BRANCH}
                - GIT_COMMIT=${GIT_COMMIT}
            additional_contexts:
                kleinkram-base: service:base
        ports:
            - '8003:8003'

        env_file:
            - .env

        networks:
            - webnet

    redis:
        image: redis:latest
        container_name: kleinkram-redis-test
        ports:
            - '6379:6379'
        networks:
            - privatenet

    queue-consumer:
        image: rslethz/kleinkram:queue-consumer-latest
        container_name: kleinkram-queue-consumer-test
        hostname: 'DO_NOT_CHANGE'
        build:
            context: .
            dockerfile: docker/queue-consumer.Dockerfile
            target: production
            additional_contexts:
                kleinkram-base: service:base
                artifact-uploader: service:artifact-uploader
        volumes:
            # mount docker socket to access docker from within the container
            - /var/run/docker.sock:/var/run/docker.sock
            - ./google-service-account.json:/app/queueConsumer/google-service-account.json:ro
        environment:
            REDIS_HOST: 'redis'
            NODE_ENV: 'test'
        env_file:
            - .env
        networks:
            - privatenet
        depends_on:
            - database

    fake-oauth:
        build: dev-oauth
        ports:
            - '8004:5000'
        networks:
            - privatenet
            - webnet

    artifact-uploader:
        image: rslethz/kleinkram:artifact-uploader-latest
        build:
            context: queueConsumer/src/artifactUpload
            dockerfile: Dockerfile

volumes:
    db_data_test:
    seaweedfs_data_test:
    logging-prometheus-storage:
    logging-tempo-data:
    vitepress_dist:
    node_modules:

networks:
    webnet:
    privatenet:
