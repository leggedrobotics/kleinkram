packages:
  - packages/*
  - backend
  - frontend
  - queueConsumer
  - docs

allowBuilds:
  # ships prebuilt binaries since v13; never compile it
  better-sqlite3: false
  # optional ssh2 speedup (via dockerode); the slim build image has no compiler
  # and ssh2 falls back to pure JS, so never compile it
  cpu-features: false
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
  vue-demi: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@scarf/scarf'
  - '@swc/core'
  - core-js
  - esbuild
  - msgpackr-extract
  - protobufjs
  - ssh2
  - vue-demi

overrides:
  '@nestjs/common@<10.4.16': '>=10.4.16'
  better-sqlite3: '^13.0.3'
  esbuild@<=0.24.2: '>=0.25.0'
  got@<11.8.5: '>=11.8.5'
  js-yaml@>=4.0.0 <4.1.1: '>=4.1.1'
  tmp@<=0.2.3: '>=0.2.4'
