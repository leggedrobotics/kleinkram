server {
	listen 80 default_server;

	gzip on;
	gzip_min_length 1000;
	gzip_vary on;
	gzip_types text/plain text/xml text/css application/javascript application/json image/svg+xml application/wasm;

	root /usr/share/nginx/html;

	# build output with a content hash in the file name
	# a name never changes its content, so browsers may keep it forever.
	# A missing file must be a 404: falling back to index.html here would
	# answer a request for a removed chunk with HTML.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# normal routes
	# serve given url and default to index.html if not found
	# e.g. /, /user and /foo/bar will return index.html
	# index.html names the current assets, so browsers must revalidate it
	# on every load to pick up a new version.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/index.html /index.html;
	}

}
